name: Cloudflare Deploy

on:
  push:
    branches:
      - dev
      - main

jobs:
  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy DEV (Account A)
        run: wrangler pages deploy . --project-name=YOUR_DEV_PROJECT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_DEV }}

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy PROD (Account B)
        run: wrangler pages deploy . --project-name=YOUR_PROD_PROJECT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN_PROD }}
